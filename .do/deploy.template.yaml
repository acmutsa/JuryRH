spec:
  name: jury
  services:
  - name: jury-service
    dockerfile_path: Dockerfile
    envs:
    - key: VITE_JURY_NAME
      scope: RUN_AND_BUILD_TIME
    - key: VITE_JURY_URL
      scope: RUN_AND_BUILD_TIME
      value: /api
    - key: JURY_ADMIN_PASSWORD
      scope: RUN_AND_BUILD_TIME
    - key: MONGODB_URI
      scope: RUN_AND_BUILD_TIME
    git:
      branch: master
      repo_clone_url: https://github.com/hackutd/jury.git
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
